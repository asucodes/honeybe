name: crawl

on:
  schedule:
    # every 6 hours, offset to avoid the top of the hour
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: data/cache
          key: honeybee-cache-${{ github.run_id }}
          restore-keys: honeybee-cache-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Crawl, score, emit
        run: python -m pipeline.run

      - name: Commit data
        run: |
          git config user.name "honeybee-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
